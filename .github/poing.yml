dependencies:
  schedule: "weekly"
  branch: "deps/sync-admob-dependencies"
  title: "chore(deps): sync AdMob and mediation dependencies"
  commit_message: "chore(deps): update AdMob and mediation SDKs across Android and iOS"
  labels:
    - "dependencies"
  targets:
    - type: "gdscript_config"
      paths:
        - "platforms/android/src/**/config/*.gd"
        - "platforms/ios/src/**/config/*.gd"
    - type: "gradle"
      paths:
        - "platforms/android/build.gradle"
    - type: "swift_package"
      paths:
        - "platforms/ios/Package.swift"
  post_sync: "python3 .github/scripts/update_docs_dependencies.py"

triage:
  labels:
    - "bug"
    - "enhancement"
    - "documentation"
    - "question"
    - "help wanted"
    - "android"
    - "ios"
    - "dependencies"
