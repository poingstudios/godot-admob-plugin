name: "[Cron] Sync AdMob Dependencies"

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-sync:
    name: Check & Sync AdMob SDKs
    runs-on: ubuntu-latest
    if: github.repository == 'poingstudios/godot-admob-plugin'
    steps:
      - name: 1. Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: 2. Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 3. Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 4. Check and update GDScript config files
        id: sync
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_admob_dependencies.py

      - name: 5. Create Pull Request
        if: steps.sync.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          SUMMARY_TABLE: ${{ steps.sync.outputs.summary_table }}
        run: |
          BRANCH_NAME="deps/sync-admob-dependencies"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout -B "$BRANCH_NAME"
          git add -u platforms/android/src/ platforms/ios/src/
          git commit -m "chore(deps): update AdMob and mediation SDKs across Android and iOS"
          git push -f origin "$BRANCH_NAME"
          
          # Create PR body file safely
          cat << 'EOF' > pr_body.md
          ## 📦 Automated Dependency Sync

          The following upstream Google Mobile Ads (GMA) and mediation SDK updates were detected and synchronized across the GDScript plugin configuration files:

          EOF
          echo "$SUMMARY_TABLE" >> pr_body.md
          cat << 'EOF' >> pr_body.md

          ---
          *Generated automatically by `[Cron] Sync AdMob Dependencies`.*
          EOF
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number -q '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --title "chore(deps): sync AdMob and mediation dependencies" \
              --body-file pr_body.md \
              --base master \
              --label "dependencies"
          else
            gh pr edit "$EXISTING_PR" --body-file pr_body.md
            echo "PR #$EXISTING_PR is already open. Updated branch and refreshed PR description with latest updates."
          fi
