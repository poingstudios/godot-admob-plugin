name: "[Cron] Sync Godot Versions"

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-latest:
    name: Check latest Godot version
    runs-on: ubuntu-latest
    if: github.repository == 'poingstudios/godot-admob-plugin'
    outputs:
      godot_version: ${{ steps.detect.outputs.godot_version }}
      should_build: ${{ steps.detect.outputs.should_build }}
      plugin_tag: ${{ steps.detect.outputs.plugin_tag }}
    steps:
    - uses: actions/checkout@v7

    - name: Detect
      id: detect
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LATEST=$(gh api repos/godotengine/godot/releases --jq '[.[] | select(.tag_name | test("^4\\.[0-9]+(\\.[0-9]+)?-stable$")) | .tag_name][0]' | sed 's/-stable//')
        LATEST_PAD=$(echo "$LATEST" | awk -F. '{if(NF==2) print $0".0"; else print $0}')
        TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
        RELEASE_EXISTS=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" > /dev/null 2>&1 && echo "true" || echo "false")
        
        if [ "$RELEASE_EXISTS" = "true" ]; then
          A_EXISTS=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq ".assets[].name" 2>/dev/null | grep -q "android-template-v${LATEST_PAD}.zip" && echo "true" || echo "false")
          I_EXISTS=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq ".assets[].name" 2>/dev/null | grep -q "ios-template-v${LATEST_PAD}.zip" && echo "true" || echo "false")
        else
          A_EXISTS="false"
          I_EXISTS="false"
        fi

        if [ "$A_EXISTS" = "true" ] && [ "$I_EXISTS" = "true" ]; then
          echo "should_build=false" >> $GITHUB_OUTPUT
        else
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "godot_version=$LATEST_PAD" >> $GITHUB_OUTPUT
          echo "plugin_tag=$TAG" >> $GITHUB_OUTPUT
        fi

  android:
    needs: detect-latest
    if: needs.detect-latest.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.detect-latest.outputs.plugin_tag }}

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle & Godot Lib
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          platforms/android/.gradle
          platforms/android/godot-lib
        key: android-gradle-${{ needs.detect-latest.outputs.godot_version }}-${{ hashFiles('platforms/android/**/*.gradle*', 'platforms/android/gradle.properties') }}
        restore-keys: |
          android-gradle-${{ needs.detect-latest.outputs.godot_version }}-
          android-gradle-
    
    - name: Build Plugins
      working-directory: platforms/android
      run: |
        chmod +x ./scripts/unix/download_godot.sh
        ./scripts/unix/download_godot.sh ${{ needs.detect-latest.outputs.godot_version }}
        chmod +x ./gradlew
        ./gradlew build -PgodotVersion=${{ needs.detect-latest.outputs.godot_version }} --parallel

    - name: Compress the artifact output
      working-directory: platforms/android
      run: |
        ./gradlew zipPlugins -PgodotVersion="${{ needs.detect-latest.outputs.godot_version }}" --parallel

    - name: Upload binary
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.detect-latest.outputs.plugin_tag }}
      run: |
        gh release upload "$TAG" platforms/android/.output/android-template-v${{ needs.detect-latest.outputs.godot_version }}.zip --clobber --repo "${{ github.repository }}"

  ios:
    needs: detect-latest
    if: needs.detect-latest.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.detect-latest.outputs.plugin_tag }}

    - name: Dependencies
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install scons
      run: python -m pip install scons

    - name: Cache iOS build artifacts
      uses: actions/cache@v6
      with:
        path: |
          platforms/ios/build
          platforms/ios/bin/static_libraries
        key: ios-build-${{ needs.detect-latest.outputs.godot_version }}-${{ hashFiles('platforms/ios/SConstruct', 'platforms/ios/src/**') }}
        restore-keys: |
          ios-build-${{ needs.detect-latest.outputs.godot_version }}-
          ios-build-

    - name: Cache SPM dependencies
      uses: actions/cache@v6
      with:
        path: platforms/ios/.build
        key: spm-${{ hashFiles('platforms/ios/Package.swift', 'platforms/ios/Package.resolved') }}
        restore-keys: |
          spm-

    - name: Cache Godot Source & Headers
      uses: actions/cache@v6
      with:
        path: platforms/ios/godot
        key: godot-source-ios-${{ needs.detect-latest.outputs.godot_version }}

    - name: Build 
      working-directory: platforms/ios
      run: ./scripts/build.sh --parallel ${{ needs.detect-latest.outputs.godot_version }}

    - name: Upload binary
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.detect-latest.outputs.plugin_tag }}
      run: |
        gh release upload "$TAG" platforms/ios/bin/release/*.zip --clobber --repo "${{ github.repository }}"
